name: Launcher Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-launcher:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: npm ci

      - name: Build launcher
        run: npm run build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: 'false'

      - name: Verify build output
        shell: bash
        run: |
          echo "Build output directory:"
          if [ ! -d dist ]; then
            echo "ERROR: dist/ was not created by electron-builder."
            exit 1
          fi
          find dist -maxdepth 2 -type f -print
          if ! find dist -maxdepth 2 -type f | grep -q .; then
            echo "ERROR: dist/ exists but contains no files."
            exit 1
          fi

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [prepare, build-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true

      - name: Show files to publish
        run: find release-assets -maxdepth 2 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Version ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
