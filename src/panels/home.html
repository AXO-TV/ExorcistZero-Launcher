    </aside>

    <main class="main-content">
        <section class="hero-section">
            <div class="hero">
                <div class="hero-text">
                    <span class="hero-eyebrow" id="hero-eyebrow">Roleplay</span>
                    <h1 class="hero-title" id="hero-title">Exorcist Zero</h1>
                    <p class="hero-subtitle" id="hero-subtitle">Serveur Minecraft RP : Jujutsu Kaisen</p>
                </div>
                <div class="hero-art-wrap">
                    <img class="hero-art" id="hero-art" alt="" src="https://exorcist-zero.x10.mx/storage/img/gojo2.png" onerror="this.style.display='none'" />
                    <div class="hero-online"><span class="hero-online-dot off" id="hero-online-dot"></span><span id="hero-online-text"></span></div>
                </div>
            </div>

            <div class="server-bar">
                <div class="server">
                    <img class="server-img" />
                    <div class="server-text">
                        <div class="name" id="server-name"></div>
                        <div class="desc" id="server-desc"></div>
                    </div>
                    <div class="etat-text">
                        <div class="text" id="players-connected"></div>
                        <div class="online off"></div>
                    </div>
                </div>
            </div>

            <div class="changelog-section">
                <div class="changelog-title" id="changelog-title"></div>
                <div class="changelog-list" id="changelog-list"></div>
            </div>
        </section>

        <aside class="info-section">
            <div class="info-item ytb-container">
                <div class="ytb">
                    <div class="ytb-header">
                        <div class="header-text">
                            <div class="title-change" id="video-title"></div>
                        </div>
                    </div>
                    <div class="video">
                        <div class="youtube-thumbnail">
                            <img class="thumbnail-img" alt="YouTube Thumbnail" />
                            <button class="ytb-play-btn" id="play-video-btn"></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="info-item news-item">
                <section class="news-section">
                    <div class="news-list"></div>
                </section>
            </div>
            <div class="info-item census-item">
                <div class="census-card">
                    <div class="census-header">
                        <span class="census-title" id="census-title"></span>
                        <span class="census-open" id="census-open">&#8599;</span>
                    </div>
                    <div class="census-body" id="census-body"></div>
                </div>
            </div>
        </aside>

        <div class="advert-banner" id="advert-banner" style="display:none;"></div>
    </main>

    <div class="notif-overlay" id="notif-overlay" hidden>
        <div class="notif-header">
            <div class="notif-title" id="notif-title"></div>
            <div class="notif-actions">
                <button class="notif-action" id="notif-external" type="button">&#8599;</button>
                <button class="notif-action" id="notif-back" type="button">&#8592;</button>
                <button class="notif-action" id="notif-reload" type="button">&#8635;</button>
                <button class="notif-action" id="notif-close" type="button">&#10005;</button>
            </div>
        </div>
        <div class="notif-body" id="notif-body"></div>
    </div>
</div>
